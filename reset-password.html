<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nova senha — Vinci</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <main class="auth-page">

        <div class="auth-box">

            <div class="logo">
                Vinci
            </div>


            <h1>
                Criar nova senha
            </h1>


            <p class="auth-subtitle">

                Escolha uma nova senha
                para sua conta.

            </p>


            <form id="resetPasswordForm">

                <label for="newPassword">
                    Nova senha
                </label>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Sua nova senha"
                    minlength="6"
                    required
                >


                <label for="confirmPassword">
                    Confirmar senha
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Digite novamente"
                    minlength="6"
                    required
                >


                <button
                    type="submit"
                    class="button primary"
                >
                    Alterar senha
                </button>

            </form>


            <p
                id="resetPasswordMessage"
                class="message"
            ></p>

        </div>

    </main>


    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="supabase.js"></script>


    <script>

        const form =
            document.getElementById(
                "resetPasswordForm"
            );


        const message =
            document.getElementById(
                "resetPasswordMessage"
            );


        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const newPassword =
                    document
                    .getElementById("newPassword")
                    .value;


                const confirmPassword =
                    document
                    .getElementById("confirmPassword")
                    .value;


                if (
                    newPassword !==
                    confirmPassword
                ) {

                    message.textContent =
                        "As senhas não são iguais.";

                    return;

                }


                if (newPassword.length < 6) {

                    message.textContent =
                        "A senha precisa ter pelo menos 6 caracteres.";

                    return;

                }


                message.textContent =
                    "Alterando senha...";


                try {

                    const { error } =
                        await db.auth.updateUser({

                            password:
                                newPassword

                        });


                    if (error) {
                        throw error;
                    }


                    message.textContent =
                        "Senha alterada com sucesso!";


                    setTimeout(() => {

                        window.location.href =
                            "login.html";

                    }, 1800);


                } catch (error) {

                    console.error(error);

                    message.textContent =
                        "Não foi possível alterar a senha.";

                }

            }
        );

    </script>

</body>

</html>
