<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>Nova senha — Vinci</title>
    <script src="theme.js?v=focus1"></script>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link rel="stylesheet" href="global-notices.css?v=1">
    <link rel="stylesheet" href="password-security.css?v=focus1">
    <link rel="stylesheet" href="theme.css?v=dark-text-post-fix1">
</head>

<body>

    <main class="auth-page">

        <div class="auth-box">

            <div class="logo">
                Vinci
            </div>


            <h1>
                Criar nova senha
            </h1>


            <p class="auth-subtitle">

                Escolha uma nova senha
                para sua conta.

            </p>


            <form id="resetPasswordForm">

                <label for="newPassword">
                    Nova senha
                </label>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Sua nova senha"
                    minlength="8"
                    required
                >


                <label for="confirmPassword">
                    Confirmar senha
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Digite novamente"
                    minlength="8"
                    required
                >


                <div class="password-security" data-password-security data-password-input="newPassword" data-password-confirm="confirmPassword">
                    <div class="password-strength-head"><span class="password-strength-label">Crie uma senha segura</span></div>
                    <div class="password-strength-track"><i class="password-strength-fill"></i></div>
                    <div class="password-rules">
                        <span class="password-rule" data-password-rule="length">8 caracteres</span>
                        <span class="password-rule" data-password-rule="lower">letra minúscula</span>
                        <span class="password-rule" data-password-rule="upper">letra maiúscula</span>
                        <span class="password-rule" data-password-rule="number">número</span>
                        <span class="password-rule" data-password-rule="symbol">símbolo</span>
                        <span class="password-match" data-password-match>As duas senhas precisam ser iguais.</span>
                    </div>
                </div>

                <button
                    type="submit"
                    class="button primary"
                >
                    Alterar senha
                </button>

            </form>


            <p
                id="resetPasswordMessage"
                class="message"
            ></p>

        </div>

    </main>


    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="supabase.js?v=session-persist1"></script>
    <script src="global-notices.js?v=1"></script>
    <script src="password-security.js?v=focus1"></script>


    <script>

        const form =
            document.getElementById(
                "resetPasswordForm"
            );


        const message =
            document.getElementById(
                "resetPasswordMessage"
            );


        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const newPassword =
                    document
                    .getElementById("newPassword")
                    .value;


                const confirmPassword =
                    document
                    .getElementById("confirmPassword")
                    .value;


                if (
                    newPassword !==
                    confirmPassword
                ) {

                    message.textContent =
                        "As senhas não são iguais.";

                    return;

                }


                const passwordResult =
                    window.VinciPassword?.validate
                        ? window.VinciPassword.validate(newPassword)
                        : { valid: newPassword.length >= 8 };

                if (!passwordResult.valid) {

                    message.textContent =
                        window.VinciPassword?.message?.(passwordResult) ||
                        "Use uma senha mais forte.";

                    return;

                }


                message.textContent =
                    "Alterando senha...";


                try {

                    const { error } =
                        await db.auth.updateUser({

                            password:
                                newPassword

                        });


                    if (error) {
                        throw error;
                    }


                    message.textContent =
                        "Senha alterada com sucesso!";


                    setTimeout(() => {

                        window.location.href =
                            "login.html";

                    }, 1800);


                } catch (error) {

                    console.error(error);

                    message.textContent =
                        "Não foi possível alterar a senha.";

                }

            }
        );

    </script>

    <script src="zoom-lock.js?v=1"></script>
</body>

</html>
