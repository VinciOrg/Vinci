<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"><meta name="theme-color" content="#faf9f7"><title>Rooms — Vinci</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="rooms.css?v=streak-final3"><link rel="stylesheet" href="global-notices.css?v=1"></head><body>
<main class="rooms-page"><header class="rooms-header"><div><span class="rooms-kicker">VINCI 1.0</span><h1>Rooms</h1><p>Momentos que só fazem sentido juntos.</p></div><button id="openRoomCreate" class="rooms-primary">+ Nova Room</button></header>
<section id="roomInvites" class="rooms-section hidden"><div class="rooms-section-title"><div><span>Convites</span><h2>Querem você por perto</h2></div></div><div id="roomInvitesList" class="invite-list"></div></section>
<section class="rooms-section"><div class="rooms-section-title"><div><span>Suas Rooms</span><h2>Onde seus amigos estão</h2></div></div><div id="roomsList" class="rooms-grid"><div class="rooms-empty">Carregando Rooms...</div></div></section></main>
<div id="roomCreateModal" class="rooms-modal hidden" aria-hidden="true"><div class="rooms-modal-card"><div class="rooms-modal-head"><div><span>Nova Room</span><h2>Crie um espaço só de vocês</h2></div><button id="closeRoomCreate">×</button></div><label>Nome<input id="roomName" maxlength="50" placeholder="Ex.: Os Sem Futuro"></label><label>Descrição<textarea id="roomDescription" maxlength="180" placeholder="Uma frase sobre a Room..."></textarea></label><label>Foto da Room<input id="roomCover" type="file" accept="image/*"><span>Opcional. Você também pode trocar depois.</span></label><img id="roomCoverPreview" class="room-cover-preview hidden" alt="Prévia da Room"><label>Cor da Room<input id="roomColor" type="color" value="#f4a261"></label><label>Convidar por @ <span>(separe por vírgula)</span><input id="roomInviteUsers" placeholder="@ana, @lucas"></label><p id="roomCreateMessage" class="rooms-message"></p><button id="createRoomButton" class="rooms-primary rooms-full">Criar Room</button></div></div>
