<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"><meta name="theme-color" content="#faf9f7"><title>Time Capsule — Vinci</title>
    <script src="theme.js?v=focus1"></script><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="capsules.css?v=1">    <link rel="stylesheet" href="theme.css?v=dark-text-post-fix1">
    <link rel="stylesheet" href="welcome-back.css?v=welcome-back1">
</head><body>
<main class="capsules-page"><header class="capsules-hero"><button id="capsuleBack">←</button><div><span>VINCI TIME CAPSULE</span><h1>Para o futuro.</h1><p>Guardem algo agora. Abram juntos quando chegar a hora.</p></div><button id="openCapsuleCreate" class="capsule-primary">+ Nova cápsula</button></header><section><div class="capsule-heading"><span>Suas cápsulas</span><h2>Fechadas e abertas</h2></div><div id="capsulesList" class="capsules-list"><div class="capsule-state">Carregando cápsulas...</div></div></section></main>
<div id="capsuleCreateModal" class="capsule-modal hidden"><div class="capsule-modal-card"><div class="capsule-modal-head"><div><span>Nova cápsula</span><h2>Quem vai abrir com você?</h2></div><button id="closeCapsuleCreate">×</button></div><label>Tipo<select id="capsuleType"><option value="friend">Com um amigo</option><option value="room">Com uma Room</option></select></label><label>Destino<select id="capsuleTarget"></select></label><label>Título<input id="capsuleTitle" maxlength="80" placeholder="Ex.: Nós daqui a um ano"></label><label>Abrir em<input id="capsuleReveal" type="datetime-local"></label><p id="capsuleCreateMessage"></p><button id="createCapsule" class="capsule-primary capsule-full">Criar cápsula</button></div></div>
<div id="capsuleViewer" class="capsule-modal hidden"><div class="capsule-modal-card viewer"><div class="capsule-modal-head"><div><span id="capsuleViewerKicker">Cápsula</span><h2 id="capsuleViewerTitle">—</h2></div><button id="closeCapsuleViewer">×</button></div><div id="capsuleCountdown" class="capsule-countdown"></div><div id="capsuleEntries" class="capsule-entries"></div><div id="capsuleContribution" class="capsule-contribution"><h3>Sua contribuição</h3><textarea id="capsuleText" maxlength="2500" placeholder="Escreva algo para o futuro..."></textarea><label class="capsule-photo-label">Adicionar foto<input id="capsulePhoto" type="file" accept="image/*"></label><img id="capsulePhotoPreview" class="hidden" alt="Prévia"><button id="saveCapsuleEntry" class="capsule-primary capsule-full">Guardar na cápsula</button><p id="capsuleEntryMessage"></p></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js?v=session-persist1"></script><script src="auth-guard.js?v=session-persist1"></script><script src="capsules.js?v=1"></script><script src="zoom-lock.js?v=1"></script>    <script src="welcome-back.js?v=welcome-back1"></script>
</body></html>
