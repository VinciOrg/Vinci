<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#faf9f7"
    >

    <title>Vinci</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <main class="feed-page">


        <!-- CABEÇALHO -->

        <header class="feed-header">

            <div class="vinci-logo">
                Vinci
            </div>

        </header>



        <!-- FEED -->

        <section
            id="feed"
            class="feed"
        >

            <!--
                Os posts serão inseridos
                automaticamente pelo feed.js
            -->

        </section>



        <!-- LOADING -->

        <div
            id="feedLoading"
            class="feed-status"
        >

            Carregando publicações...

        </div>



        <!-- FEED VAZIO -->

        <div
            id="feedEmpty"
            class="feed-status hidden"
        >

            <div class="empty-icon">
                📸
            </div>

            <h2>
                Ainda não há publicações
            </h2>

            <p>
                Seja a primeira pessoa a postar uma fotografia.
            </p>

        </div>



        <!-- ERRO -->

        <div
            id="feedError"
            class="feed-status hidden"
        >

            Não foi possível carregar as publicações.

        </div>


    </main>



    <!-- NAVEGAÇÃO -->

    <nav class="bottom-nav">


        <a
            href="index.html"
            class="active"
        >

            <span>
                ⌂
            </span>

            Posts

        </a>


        <a href="post.html">

            <span class="nav-post">
                +
            </span>

            Postar

        </a>


        <a href="profile.html">

            <span>
                ◯
            </span>

            Perfil

        </a>


    </nav>



    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <script src="supabase.js"></script>


    <script src="auth-guard.js"></script>


    <script src="feed.js"></script>


</body>

</html>
