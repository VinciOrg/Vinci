<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta
        name="theme-color"
        content="#faf9f7"
    >

    <title>Vinci</title>
    <script src="theme.js?v=focus1"></script>

    <!-- =====================================
         PWA / iPHONE
    ====================================== -->
    <link rel="manifest" href="manifest.json?v=2">
    <link rel="apple-touch-icon" href="assets/icon-vinci.png">
    <link rel="icon" type="image/png" href="assets/icon-vinci.png">

    <meta name="application-name" content="Vinci">
    <meta name="apple-mobile-web-app-title" content="Vinci">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">


    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="stylesheet"
        href="search.css"
    >
    
    <link
        rel="stylesheet"
        href="likes.css"
    >

    <link
        rel="stylesheet"
        href="replies.css"
    >

    <link rel="stylesheet" href="reply-photos.css">
    <link rel="stylesheet" href="notifications.css">
    

    <link rel="stylesheet" href="global-notices.css?v=1">
    <link rel="stylesheet" href="global-cosmetics.css?v=clean-cut4">
    <link rel="stylesheet" href="theme.css?v=dark-text-post-fix1">
    <link rel="stylesheet" href="focus-nav.css?v=focus1">
    <link rel="stylesheet" href="frame-motion.css?v=motion-fix3">
    <link rel="stylesheet" href="frame-engine.css?v=clean-cut4">
    <link rel="stylesheet" href="welcome-back.css?v=welcome-back1">
</head>

<body>

    <!-- =====================================
         FEED
    ====================================== -->

    <main class="feed-page">

        <!-- CABEÇALHO -->

        <header class="feed-header">

            <div class="vinci-logo">
                Vinci
            </div>

            <button
                type="button"
                id="openSearch"
                class="search-button"
                aria-label="Pesquisar usuários"
            >
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="11" cy="11" r="5.75"></circle>
    <path d="M16 16l4 4"></path>
</svg>
            </button>

        </header>

        <!-- FEED -->

        <section
            id="feed"
            class="feed"
        >

            <!--
                Os posts serão inseridos
                automaticamente pelo feed.js
            -->

        </section>

        <!-- LOADING -->

        <div
            id="feedLoading"
            class="feed-status"
        >

            Carregando publicações...

        </div>

        <!-- FEED VAZIO -->

        <div
            id="feedEmpty"
            class="feed-status hidden"
        >

            <div class="empty-icon">
                📸
            </div>

            <h2>
                Ainda não há publicações
            </h2>

            <p>
                Seja a primeira pessoa a postar uma fotografia.
            </p>

        </div>

        <!-- ERRO -->

        <div
            id="feedError"
            class="feed-status hidden"
        >

            Não foi possível carregar as publicações.

        </div>

    </main>

    <!-- =====================================
         PESQUISA DE USUÁRIOS
    ====================================== -->

    <div
        id="searchPanel"
        class="search-panel hidden"
    >

        <div class="search-content">

            <div class="search-header">

                <div class="search-input-wrapper">

                    <span class="search-input-icon">
                        🔎
                    </span>

                    <input
                        type="search"
                        id="searchInput"
                        class="search-input"
                        placeholder="@usuario ou nome"
                        autocomplete="off"
                        maxlength="50"
                    >

                    <button
                        type="button"
                        id="searchSubmit"
                        class="search-submit"
                    >
                        Pesquisar
                    </button>

                </div>

                <button
                    type="button"
                    id="closeSearch"
                    class="search-close"
                    aria-label="Fechar pesquisa"
                >
                    ×
                </button>

            </div>

            <div
                id="searchResults"
                class="search-results"
            ></div>

        </div>

    </div>

    <!-- =====================================
         NAVEGAÇÃO
    ====================================== -->

    <nav class="bottom-nav">

        <!-- POSTS / FEED -->

        <a
            href="index.html"
            class="active"
        >

            <span>
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M3.5 10.5L12 3.75l8.5 6.75"></path>
    <path d="M6 9.75V20h12V9.75"></path>
    <path d="M10 20v-5h4v5"></path>
</svg>
            </span>

            Posts

        </a>

        <!-- CRIAR -->

        <button
            type="button"
            id="openCreateMenu"
            class="nav-create"
        >

            <span class="nav-post">
                <svg class="nav-plus-icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 5v14"></path>
    <path d="M5 12h14"></path>
</svg>
            </span>

            Postar

        </button>

        <!-- PERFIL -->

        
        <a href="rooms.html"><span>
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="8" cy="9" r="2.5"></circle><circle cx="16" cy="9" r="2.5"></circle>
    <path d="M3.5 19c.9-3 2.8-4.5 5-4.5s4.1 1.5 5 4"></path><path d="M11 18.5c.9-2.7 2.7-4 4.8-4 2 0 3.8 1.3 4.7 4"></path>
</svg>
            </span>Rooms</a>
<a
            href="profile.html"
        >

            <span>
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="8" r="3.25"></circle>
    <path d="M5.5 19c1.65-2.85 4.1-4.25 6.5-4.25S16.85 16.15 18.5 19"></path>
</svg>
            </span>

            Perfil

        </a>

    </nav>

    <!-- =====================================
         MENU DE CRIAÇÃO
    ====================================== -->

    <div
        id="createMenu"
        class="create-menu hidden"
    >

        <div class="create-menu-content">

            <!-- FECHAR -->

            <button
                type="button"
                id="closeCreateMenu"
                class="create-menu-close"
            >
                ×
            </button>

            <!-- TÍTULO -->

            <div class="create-menu-title">

                <span>
                    Vinci
                </span>

                <h2>
                    O que você quer publicar?
                </h2>

            </div>

            <!-- =================================
                 PUBLICAÇÃO
            ================================== -->

            <button
                type="button"
                id="createPublication"
                class="create-option"
            >

                <div class="create-option-icon">
                <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 9.25A2.25 2.25 0 0 1 6.25 7h1.45l1.05-1.5h6.5L16.3 7h1.45A2.25 2.25 0 0 1 20 9.25v8.5A2.25 2.25 0 0 1 17.75 20h-11.5A2.25 2.25 0 0 1 4 17.75z"></path>
    <circle cx="12" cy="13" r="3.25"></circle>
</svg>
            </div>

                <div class="create-option-text">

                    <strong>
                        Publicação
                    </strong>

                    <span>
                        Compartilhe uma fotografia
                    </span>

                </div>

                <span class="create-option-arrow">
                    →
                </span>

            </button>

            <!-- =================================
                 POST
            ================================== -->

            <button
                type="button"
                id="createProfilePost"
                class="create-option"
            >

                <div class="create-option-icon">
                <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M6.25 5.5h11.5A2.25 2.25 0 0 1 20 7.75v7.5a2.25 2.25 0 0 1-2.25 2.25H10l-4 3v-3H6.25A2.25 2.25 0 0 1 4 15.25v-7.5A2.25 2.25 0 0 1 6.25 5.5z"></path>
</svg>
            </div>

                <div class="create-option-text">

                    <strong>
                        Post
                    </strong>

                    <span>
                        Compartilhe algo no seu perfil
                    </span>

                </div>

                <span class="create-option-arrow">
                    →
                </span>

            </button>

            <!-- CANCELAR -->

            <button
                type="button"
                id="cancelCreate"
                class="create-cancel"
            >
                Cancelar
            </button>

        </div>

    </div>


    <!-- =====================================
         SUPABASE / SISTEMAS
    ====================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="supabase.js?v=session-persist1"></script>
    <script src="global-notices.js?v=1"></script>
    <script src="auth-guard.js?v=session-persist1"></script>

    <script src="feed.js"></script>
    <script src="delete-system.js"></script>
    <script src="profile-navigation.js"></script>
    <script src="create.js"></script>
    <script src="search.js"></script>
    <script src="likes.js"></script>
    <script src="reply-photo-utils.js"></script>
    <script src="replies.js"></script>
    <script src="notifications-badge.js"></script>

    <script src="global-cosmetics.js?v=clean-cut4"></script>
    <script src="zoom-lock.js?v=1"></script>
    <script src="focus-nav.js?v=focus1"></script>
    <script src="frame-engine.js?v=clean-cut4"></script>
    <script src="welcome-back.js?v=welcome-back1"></script>
</body>

</html>
