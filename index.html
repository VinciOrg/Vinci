<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#faf9f7"
    >

    <title>Vinci</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
    <link rel="stylesheet" href="loading.css">

    <link
        rel="stylesheet"
        href="search.css"
    >
    
    <link
        rel="stylesheet"
        href="likes.css"
    >

    <link
        rel="stylesheet"
        href="replies.css"
    >

    <link rel="stylesheet" href="reply-photos.css">
    <link rel="stylesheet" href="notifications.css">
    

</head>

<body>

        <!-- =====================================
         VINCI — SHUTTER LOADER GLOBAL 0.7.7
    ====================================== -->
    <div
        id="vinciGlobalLoader"
        class="vinci-loader vinci-loader--visible"
        role="status"
        aria-live="polite"
        aria-hidden="false"
    >
        <div class="vinci-loader__flash-screen" aria-hidden="true"></div>

        <div class="vinci-loader__content">
            <div class="vinci-loader__logo-wrap" aria-hidden="true">
                <div class="vinci-loader__halo"></div>

                <svg
                    class="vinci-loader__mark"
                    viewBox="0 0 120 108"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <defs>
                        <linearGradient id="vinciLoaderLeftArm" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0" stop-color="#ffb474"/>
                            <stop offset="1" stop-color="#f28b3c"/>
                        </linearGradient>

                        <linearGradient id="vinciLoaderRightArm" x1="1" y1="0" x2="0" y2="1">
                            <stop offset="0" stop-color="#f79b52"/>
                            <stop offset="1" stop-color="#d96f1f"/>
                        </linearGradient>

                        <filter id="vinciLoaderShadow" x="-50%" y="-50%" width="200%" height="200%">
                            <feDropShadow
                                dx="0"
                                dy="8"
                                stdDeviation="7"
                                flood-color="#d96f1f"
                                flood-opacity="0.18"
                            />
                        </filter>
                    </defs>

                    <g filter="url(#vinciLoaderShadow)">
                        <g>
                            <path
                                d="M22 18 C17 18 14 23 17 28 L51 91 C54 97 61 97 64 91 L69 81 L42 25 C40 20 35 18 30 18 Z"
                                fill="url(#vinciLoaderLeftArm)"
                            />

                            <animateTransform
                                attributeName="transform"
                                type="rotate"
                                values="0 60 92; 0 60 92; 11 60 92; 11 60 92; 0 60 92; 0 60 92"
                                keyTimes="0; .22; .39; .52; .72; 1"
                                dur="1.45s"
                                repeatCount="indefinite"
                            />
                        </g>

                        <g>
                            <path
                                d="M98 18 C103 18 106 23 103 28 L69 91 C66 97 59 97 56 91 L51 81 L78 25 C80 20 85 18 90 18 Z"
                                fill="url(#vinciLoaderRightArm)"
                            />

                            <animateTransform
                                attributeName="transform"
                                type="rotate"
                                values="0 60 92; 0 60 92; -11 60 92; -11 60 92; 0 60 92; 0 60 92"
                                keyTimes="0; .22; .39; .52; .72; 1"
                                dur="1.45s"
                                repeatCount="indefinite"
                            />
                        </g>
                    </g>

                    <g>
                        <circle
                            cx="60"
                            cy="48"
                            r="23"
                            fill="#fffaf6"
                            stroke="#f28b3c"
                            stroke-width="4"
                        />

                        <circle
                            cx="60"
                            cy="48"
                            r="17"
                            fill="#3b3029"
                        />

                        <g
                            opacity="0.72"
                            stroke="#f7c29b"
                            stroke-width="2.4"
                            stroke-linecap="round"
                        >
                            <line x1="60" y1="33" x2="60" y2="39"/>
                            <line x1="73" y1="40.5" x2="67.8" y2="43.5"/>
                            <line x1="73" y1="55.5" x2="67.8" y2="52.5"/>
                            <line x1="60" y1="63" x2="60" y2="57"/>
                            <line x1="47" y1="55.5" x2="52.2" y2="52.5"/>
                            <line x1="47" y1="40.5" x2="52.2" y2="43.5"/>

                            <animateTransform
                                attributeName="transform"
                                type="rotate"
                                values="0 60 48; 0 60 48; 50 60 48; 50 60 48; 0 60 48; 0 60 48"
                                keyTimes="0; .22; .42; .52; .72; 1"
                                dur="1.45s"
                                repeatCount="indefinite"
                            />
                        </g>

                        <circle
                            cx="60"
                            cy="48"
                            r="9"
                            fill="#fffaf6"
                        >
                            <animate
                                attributeName="r"
                                values="9;9;1.7;1.7;9.5;9"
                                keyTimes="0;.22;.42;.52;.72;1"
                                dur="1.45s"
                                repeatCount="indefinite"
                            />
                        </circle>

                        <circle
                            cx="60"
                            cy="48"
                            r="3.8"
                            fill="#f28b3c"
                            opacity="0.85"
                        >
                            <animate
                                attributeName="r"
                                values="3.8;3.8;.8;.8;4.2;3.8"
                                keyTimes="0;.22;.42;.52;.72;1"
                                dur="1.45s"
                                repeatCount="indefinite"
                            />
                        </circle>

                        <circle
                            cx="60"
                            cy="48"
                            r="10"
                            fill="#ffffff"
                            opacity="0"
                        >
                            <animate
                                attributeName="opacity"
                                values="0;0;0;.95;0;0"
                                keyTimes="0;.43;.47;.50;.57;1"
                                dur="1.45s"
                                repeatCount="indefinite"
                            />

                            <animate
                                attributeName="r"
                                values="10;10;10;28;34;34"
                                keyTimes="0;.43;.47;.50;.57;1"
                                dur="1.45s"
                                repeatCount="indefinite"
                            />
                        </circle>
                    </g>
                </svg>
            </div>

            <div class="vinci-loader__brand">
                Vinci
            </div>

            <p class="vinci-loader__message">
                <span class="vinci-loader__message-text">Carregando</span><span class="vinci-loader__dots" aria-hidden="true"></span>
            </p>
        </div>
    </div>

<main class="feed-page">

        <!-- CABEÇALHO -->

        <header class="feed-header">

            <div class="vinci-logo">
                Vinci
            </div>

            <button
                type="button"
                id="openSearch"
                class="search-button"
                aria-label="Pesquisar usuários"
            >
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="11" cy="11" r="5.75"></circle>
    <path d="M16 16l4 4"></path>
</svg>
            </button>

        </header>

        <!-- FEED -->

        <section
            id="feed"
            class="feed"
        >

            <!--
                Os posts serão inseridos
                automaticamente pelo feed.js
            -->

        </section>

        <!-- LOADING -->

        <div
            id="feedLoading"
            class="feed-status"
        >

            Carregando publicações...

        </div>

        <!-- FEED VAZIO -->

        <div
            id="feedEmpty"
            class="feed-status hidden"
        >

            <div class="empty-icon">
                📸
            </div>

            <h2>
                Ainda não há publicações
            </h2>

            <p>
                Seja a primeira pessoa a postar uma fotografia.
            </p>

        </div>

        <!-- ERRO -->

        <div
            id="feedError"
            class="feed-status hidden"
        >

            Não foi possível carregar as publicações.

        </div>

    </main>

    <!-- =====================================
         PESQUISA DE USUÁRIOS
    ====================================== -->

    <div
        id="searchPanel"
        class="search-panel hidden"
    >

        <div class="search-content">

            <div class="search-header">

                <div class="search-input-wrapper">

                    <span class="search-input-icon">
                        🔎
                    </span>

                    <input
                        type="search"
                        id="searchInput"
                        class="search-input"
                        placeholder="@usuario ou nome"
                        autocomplete="off"
                        maxlength="50"
                    >

                    <button
                        type="button"
                        id="searchSubmit"
                        class="search-submit"
                    >
                        Pesquisar
                    </button>

                </div>

                <button
                    type="button"
                    id="closeSearch"
                    class="search-close"
                    aria-label="Fechar pesquisa"
                >
                    ×
                </button>

            </div>

            <div
                id="searchResults"
                class="search-results"
            ></div>

        </div>

    </div>

    <!-- =====================================
         NAVEGAÇÃO
    ====================================== -->

    <nav class="bottom-nav">

        <!-- POSTS / FEED -->

        <a
            href="index.html"
            class="active"
        >

            <span>
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M3.5 10.5L12 3.75l8.5 6.75"></path>
    <path d="M6 9.75V20h12V9.75"></path>
    <path d="M10 20v-5h4v5"></path>
</svg>
            </span>

            Posts

        </a>

        <!-- CRIAR -->

        <button
            type="button"
            id="openCreateMenu"
            class="nav-create"
        >

            <span class="nav-post">
                <svg class="nav-plus-icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 5v14"></path>
    <path d="M5 12h14"></path>
</svg>
            </span>

            Postar

        </button>

        <!-- PERFIL -->

        <a
            href="profile.html"
        >

            <span>
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="8" r="3.25"></circle>
    <path d="M5.5 19c1.65-2.85 4.1-4.25 6.5-4.25S16.85 16.15 18.5 19"></path>
</svg>
            </span>

            Perfil

        </a>

    </nav>

    <!-- =====================================
         MENU DE CRIAÇÃO
    ====================================== -->

    <div
        id="createMenu"
        class="create-menu hidden"
    >

        <div class="create-menu-content">

            <!-- FECHAR -->

            <button
                type="button"
                id="closeCreateMenu"
                class="create-menu-close"
            >
                ×
            </button>

            <!-- TÍTULO -->

            <div class="create-menu-title">

                <span>
                    Vinci
                </span>

                <h2>
                    O que você quer publicar?
                </h2>

            </div>

            <!-- =================================
                 PUBLICAÇÃO
            ================================== -->

            <button
                type="button"
                id="createPublication"
                class="create-option"
            >

                <div class="create-option-icon">
                <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 9.25A2.25 2.25 0 0 1 6.25 7h1.45l1.05-1.5h6.5L16.3 7h1.45A2.25 2.25 0 0 1 20 9.25v8.5A2.25 2.25 0 0 1 17.75 20h-11.5A2.25 2.25 0 0 1 4 17.75z"></path>
    <circle cx="12" cy="13" r="3.25"></circle>
</svg>
            </div>

                <div class="create-option-text">

                    <strong>
                        Publicação
                    </strong>

                    <span>
                        Compartilhe uma fotografia
                    </span>

                </div>

                <span class="create-option-arrow">
                    →
                </span>

            </button>

            <!-- =================================
                 POST
            ================================== -->

            <button
                type="button"
                id="createProfilePost"
                class="create-option"
            >

                <div class="create-option-icon">
                <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M6.25 5.5h11.5A2.25 2.25 0 0 1 20 7.75v7.5a2.25 2.25 0 0 1-2.25 2.25H10l-4 3v-3H6.25A2.25 2.25 0 0 1 4 15.25v-7.5A2.25 2.25 0 0 1 6.25 5.5z"></path>
</svg>
            </div>

                <div class="create-option-text">

                    <strong>
                        Post
                    </strong>

                    <span>
                        Compartilhe algo no seu perfil
                    </span>

                </div>

                <span class="create-option-arrow">
                    →
                </span>

            </button>

            <!-- CANCELAR -->

            <button
                type="button"
                id="cancelCreate"
                class="create-cancel"
            >
                Cancelar
            </button>

        </div>

    </div>


    <!-- =====================================
         SUPABASE / SISTEMAS
    ====================================== -->

    <script src="loading.js"></script>

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="supabase.js"></script>
    <script src="auth-guard.js"></script>

    <script src="feed.js"></script>
    <script src="delete-system.js"></script>
    <script src="profile-navigation.js"></script>
    <script src="create.js"></script>
    <script src="search.js"></script>
    <script src="likes.js"></script>
    <script src="reply-photo-utils.js"></script>
    <script src="replies.js"></script>
    <script src="notifications-badge.js"></script>

</body>

</html>
