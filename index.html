<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#faf9f7"
    >

    <title>Vinci</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="stylesheet"
        href="search.css"
    >
    
    <link
        rel="stylesheet"
        href="likes.css"
    >
    

</head>

<body>

    <!-- =====================================
         FEED
    ====================================== -->

    <main class="feed-page">

        <!-- CABEÇALHO -->

        <header class="feed-header">

            <div class="vinci-logo">
                Vinci
            </div>

            <button
                type="button"
                id="openSearch"
                class="search-button"
                aria-label="Pesquisar usuários"
            >
                🔎
            </button>

        </header>

        <!-- FEED -->

        <section
            id="feed"
            class="feed"
        >

            <!--
                Os posts serão inseridos
                automaticamente pelo feed.js
            -->

        </section>

        <!-- LOADING -->

        <div
            id="feedLoading"
            class="feed-status"
        >

            Carregando publicações...

        </div>

        <!-- FEED VAZIO -->

        <div
            id="feedEmpty"
            class="feed-status hidden"
        >

            <div class="empty-icon">
                📸
            </div>

            <h2>
                Ainda não há publicações
            </h2>

            <p>
                Seja a primeira pessoa a postar uma fotografia.
            </p>

        </div>

        <!-- ERRO -->

        <div
            id="feedError"
            class="feed-status hidden"
        >

            Não foi possível carregar as publicações.

        </div>

    </main>

    <!-- =====================================
         PESQUISA DE USUÁRIOS
    ====================================== -->

    <div
        id="searchPanel"
        class="search-panel hidden"
    >

        <div class="search-content">

            <div class="search-header">

                <div class="search-input-wrapper">

                    <span class="search-input-icon">
                        🔎
                    </span>

                    <input
                        type="search"
                        id="searchInput"
                        class="search-input"
                        placeholder="@usuario ou nome"
                        autocomplete="off"
                        maxlength="50"
                    >

                    <button
                        type="button"
                        id="searchSubmit"
                        class="search-submit"
                    >
                        Pesquisar
                    </button>

                </div>

                <button
                    type="button"
                    id="closeSearch"
                    class="search-close"
                    aria-label="Fechar pesquisa"
                >
                    ×
                </button>

            </div>

            <div
                id="searchResults"
                class="search-results"
            ></div>

        </div>

    </div>

    <!-- =====================================
         NAVEGAÇÃO
    ====================================== -->

    <nav class="bottom-nav">

        <!-- POSTS / FEED -->

        <a
            href="index.html"
            class="active"
        >

            <span>
                ⌂
            </span>

            Posts

        </a>

        <!-- CRIAR -->

        <button
            type="button"
            id="openCreateMenu"
            class="nav-create"
        >

            <span class="nav-post">
                +
            </span>

            Postar

        </button>

        <!-- PERFIL -->

        <a
            href="profile.html"
        >

            <span>
                ◯
            </span>

            Perfil

        </a>

    </nav>

    <!-- =====================================
         MENU DE CRIAÇÃO
    ====================================== -->

    <div
        id="createMenu"
        class="create-menu hidden"
    >

        <div class="create-menu-content">

            <!-- FECHAR -->

            <button
                type="button"
                id="closeCreateMenu"
                class="create-menu-close"
            >
                ×
            </button>

            <!-- TÍTULO -->

            <div class="create-menu-title">

                <span>
                    Vinci
                </span>

                <h2>
                    O que você quer publicar?
                </h2>

            </div>

            <!-- =================================
                 PUBLICAÇÃO
            ================================== -->

            <button
                type="button"
                id="createPublication"
                class="create-option"
            >

                <div class="create-option-icon">
                    📸
                </div>

                <div class="create-option-text">

                    <strong>
                        Publicação
                    </strong>

                    <span>
                        Compartilhe uma fotografia
                    </span>

                </div>

                <span class="create-option-arrow">
                    →
                </span>

            </button>

            <!-- =================================
                 POST
            ================================== -->

            <button
                type="button"
                id="createProfilePost"
                class="create-option"
            >

                <div class="create-option-icon">
                    💬
                </div>

                <div class="create-option-text">

                    <strong>
                        Post
                    </strong>

                    <span>
                        Compartilhe algo no seu perfil
                    </span>

                </div>

                <span class="create-option-arrow">
                    →
                </span>

            </button>

            <!-- CANCELAR -->

            <button
                type="button"
                id="cancelCreate"
                class="create-cancel"
            >
                Cancelar
            </button>

        </div>

    </div>


    <!-- =====================================
         SUPABASE / SISTEMAS
    ====================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="supabase.js"></script>
    <script src="auth-guard.js"></script>

    <script src="feed.js"></script>
    <script src="delete-system.js"></script>
    <script src="profile-navigation.js"></script>
    <script src="create.js"></script>
    <script src="search.js"></script>
    <script src="likes.js"></script>

</body>

</html>
