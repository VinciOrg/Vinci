<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#faf9f7">
    <title>Círculos — Vinci</title>
    <script src="theme.js?v=focus1"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="circles.css">
    <link rel="stylesheet" href="global-notices.css?v=1">
    <link rel="stylesheet" href="theme.css?v=dark-text-post-fix1">
    <link rel="stylesheet" href="focus-nav.css?v=focus1">
    <link rel="stylesheet" href="welcome-back.css?v=welcome-back1">
</head>
<body>
    <main class="feature-page circles-page">
        <header class="feature-header">
            <button type="button" class="back-button" id="circlesBack">←</button>
            <div>
                <span class="feature-kicker">Privacidade Vinci</span>
                <h1>Círculos</h1>
            </div>
        </header>

        <section class="feature-intro">
            <div class="feature-intro-icon">◎</div>
            <div>
                <h2>Escolha quem entra no seu mundo.</h2>
                <p>Crie grupos de pessoas e use esses círculos para limitar quem pode visualizar uma publicação.</p>
            </div>
        </section>

        <section class="circle-create-card">
            <label for="newCircleName">Novo círculo</label>
            <div class="circle-create-row">
                <input id="newCircleName" type="text" maxlength="40" placeholder="Ex.: Amigos próximos">
                <button id="createCircle" type="button" class="button primary">Criar</button>
            </div>
            <p id="circleMessage" class="feature-message"></p>
        </section>

        <section>
            <div class="feature-section-title">
                <div>
                    <span>Seus grupos</span>
                    <h2>Meus círculos</h2>
                </div>
                <span id="circleCount" class="feature-count">0</span>
            </div>
            <div id="circlesList" class="circles-list">
                <div class="feature-loading">Carregando círculos...</div>
            </div>
        </section>
    </main>

    <nav class="bottom-nav">
        <a href="index.html"><span>
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M3.5 10.5L12 3.75l8.5 6.75"></path>
    <path d="M6 9.75V20h12V9.75"></path>
    <path d="M10 20v-5h4v5"></path>
</svg>
            </span>Posts</a>
        <button type="button" class="nav-create" onclick="location.href='index.html#create'"><span class="nav-post">
                <svg class="nav-plus-icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 5v14"></path>
    <path d="M5 12h14"></path>
</svg>
            </span>Postar</button>
        
        <a href="rooms.html"><span>
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="8" cy="9" r="2.5"></circle><circle cx="16" cy="9" r="2.5"></circle>
    <path d="M3.5 19c.9-3 2.8-4.5 5-4.5s4.1 1.5 5 4"></path><path d="M11 18.5c.9-2.7 2.7-4 4.8-4 2 0 3.8 1.3 4.7 4"></path>
</svg>
            </span>Rooms</a>
<a href="profile.html" class="active"><span>
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="8" r="3.25"></circle>
    <path d="M5.5 19c1.65-2.85 4.1-4.25 6.5-4.25S16.85 16.15 18.5 19"></path>
</svg>
            </span>Perfil</a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js?v=session-persist1"></script>
    <script src="global-notices.js?v=1"></script>
    <script src="auth-guard.js?v=session-persist1"></script>
    <script src="circles.js"></script>
    <script src="zoom-lock.js?v=1"></script>
    <script src="focus-nav.js?v=focus1"></script>
    <script src="welcome-back.js?v=welcome-back1"></script>
</body>
</html>
