<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta
        name="theme-color"
        content="#faf9f7"
    >

    <title>Novo Post — Vinci</title>
    <script src="theme.js?v=focus1"></script>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link rel="stylesheet" href="post-circles.css">
    <link rel="stylesheet" href="post-options.css">

    <link rel="stylesheet" href="global-notices.css?v=1">
    <link rel="stylesheet" href="theme.css?v=dark-text-post-fix1">
    <link rel="stylesheet" href="focus-nav.css?v=focus1">
</head>


<body>


    <main class="profile-post-page">


        <!-- CABEÇALHO -->

        <header class="create-post-header">

            <button
                type="button"
                id="cancelPost"
                class="create-back"
            >
                ←
            </button>

            <h1>
                Novo post
            </h1>

            <button
                type="button"
                id="publishProfilePost"
                class="create-publish"
            >
                Publicar
            </button>

        </header>


        <!-- EDITOR -->

        <section class="profile-post-editor">


            <textarea
                id="profilePostContent"
                maxlength="500"
                placeholder="O que você quer compartilhar?"
                autofocus
            ></textarea>


            <div class="profile-post-footer">

                <span id="profilePostCounter">
                    0 / 500
                </span>

                <span id="profilePostMessage"></span>

            </div>


        </section>


        <!-- CÍRCULOS DE ACESSO -->

        <section class="post-audience-card profile-post-audience">

            <div class="post-audience-heading">
                <h3>Quem pode visualizar?</h3>
                <span>Círculos</span>
            </div>

            <p class="post-audience-description">
                Defina se este post de texto será público ou visível apenas para um dos seus círculos.
            </p>

            <div class="audience-options">

                <label class="audience-option">
                    <input type="radio" name="audienceType" value="public" checked>

                    <div>
                        <strong class="audience-option-title">
                            <svg class="audience-option-icon" viewBox="0 0 24 24" aria-hidden="true">
                                <circle cx="12" cy="12" r="8.5"></circle>
                                <path d="M3.8 12h16.4"></path>
                                <path d="M12 3.5c2.2 2.35 3.4 5.2 3.4 8.5S14.2 18.15 12 20.5"></path>
                                <path d="M12 3.5C9.8 5.85 8.6 8.7 8.6 12s1.2 6.15 3.4 8.5"></path>
                            </svg>
                            Público
                        </strong>

                        <small>Qualquer pessoa autenticada no Vinci pode visualizar.</small>
                    </div>
                </label>

                <label class="audience-option">
                    <input type="radio" name="audienceType" value="circle">

                    <div>
                        <strong class="audience-option-title">
                            <svg class="audience-option-icon" viewBox="0 0 24 24" aria-hidden="true">
                                <circle cx="9" cy="9" r="3"></circle>
                                <circle cx="16.5" cy="10" r="2.5"></circle>
                                <path d="M3.8 19c1.1-3 3.05-4.5 5.2-4.5s4.1 1.5 5.2 4.5"></path>
                                <path d="M14.2 15.2c2.4-.5 4.55.65 5.8 3.3"></path>
                            </svg>
                            Um círculo
                        </strong>

                        <small>Somente você e as pessoas desse círculo.</small>
                    </div>
                </label>

            </div>

            <div id="circleAudienceWrap" class="circle-select-wrap hidden">
                <select id="circleAudienceSelect" aria-label="Escolher círculo">
                    <option value="">Carregando círculos...</option>
                </select>
                <p id="circleAudienceNote" class="circle-select-note"></p>
            </div>

        </section>


    </main>



    <!-- NAVEGAÇÃO -->

    <nav class="bottom-nav">

        <a href="index.html">

            <span>
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M3.5 10.5L12 3.75l8.5 6.75"></path>
    <path d="M6 9.75V20h12V9.75"></path>
    <path d="M10 20v-5h4v5"></path>
</svg>
            </span>

            Posts

        </a>


        <button
            type="button"
            class="nav-create"
            onclick="window.location.href='index.html#create'"
        >

            <span class="nav-post">
                <svg class="nav-plus-icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 5v14"></path>
    <path d="M5 12h14"></path>
</svg>
            </span>

            Postar

        </button>


        
        <a href="rooms.html"><span>
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="8" cy="9" r="2.5"></circle><circle cx="16" cy="9" r="2.5"></circle>
    <path d="M3.5 19c.9-3 2.8-4.5 5-4.5s4.1 1.5 5 4"></path><path d="M11 18.5c.9-2.7 2.7-4 4.8-4 2 0 3.8 1.3 4.7 4"></path>
</svg>
            </span>Rooms</a>
<a href="profile.html">

            <span>
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="8" r="3.25"></circle>
    <path d="M5.5 19c1.65-2.85 4.1-4.25 6.5-4.25S16.85 16.15 18.5 19"></path>
</svg>
            </span>

            Perfil

        </a>

    </nav>



    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <script src="supabase.js?v=session-persist1"></script>
    <script src="global-notices.js?v=1"></script>


    <script src="auth-guard.js?v=session-persist1"></script>

    <script src="post-circles.js"></script>

    <script src="profile-post.js"></script>


    <script src="zoom-lock.js?v=1"></script>
    <script src="focus-nav.js?v=focus1"></script>
</body>

</html>
