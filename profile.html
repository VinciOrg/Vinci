<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Perfil — Vinci</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <!-- ============================= -->
    <!-- HEADER -->
    <!-- ============================= -->

    <header class="profile-header">

        <a
            href="index.html"
            class="back-button"
        >
            ←
        </a>

        <div class="profile-header-logo">
            Vinci
        </div>

        <div class="header-spacer"></div>

    </header>


    <!-- ============================= -->
    <!-- PERFIL -->
    <!-- ============================= -->

    <main class="profile-page">

        <section class="profile-card">

            <div class="profile-top">

                <!-- AVATAR -->

                <div class="avatar-wrapper">

                    <div
                        id="avatar"
                        class="profile-avatar"
                    >

                        <span id="avatarLetter">
                            U
                        </span>

                    </div>

                    <input
                        type="file"
                        id="avatarInput"
                        accept="image/jpeg,image/png,image/webp"
                        hidden
                    >

                    <button
                        type="button"
                        id="changeAvatar"
                        class="avatar-change"
                    >
                        Alterar foto
                    </button>

                </div>


                <!-- INFORMAÇÕES -->

                <div class="profile-info">

                    <h1 id="profileName">
                        Carregando...
                    </h1>

                    <div
                        id="profileUsername"
                        class="profile-username"
                    >
                        @usuario
                    </div>

                    <p
                        id="profileBio"
                        class="profile-bio"
                    >
                        Carregando perfil...
                    </p>

                    <div class="profile-actions">

                        <button
                            type="button"
                            id="editProfile"
                            class="edit-profile-button"
                        >
                            Editar perfil
                        </button>

                    </div>

                </div>

            </div>


            <!-- ============================= -->
            <!-- ESTATÍSTICAS -->
            <!-- ============================= -->

            <div
                id="profileStats"
                class="profile-stats"
            >

                <div class="profile-stat">

                    <strong id="postsCount">
                        0
                    </strong>

                    <span>
                        fotografias
                    </span>

                </div>

            </div>

        </section>


        <!-- ============================= -->
        <!-- ABAS -->
        <!-- ============================= -->

        <section class="profile-content">

            <div class="profile-tabs">

                <button
                    type="button"
                    id="textPostsTab"
                    class="profile-tab active"
                >
                    Posts
                </button>

                <button
                    type="button"
                    id="photoPostsTab"
                    class="profile-tab"
                >
                    Fotografias
                </button>

            </div>


            <!-- ============================= -->
            <!-- POSTS DE TEXTO -->
            <!-- ============================= -->

            <section
                id="profilePostsSection"
                class="profile-posts-section"
            >

                <div
                    id="profilePosts"
                    class="profile-posts"
                >

                    <div class="profile-posts-loading">
                        Carregando posts...
                    </div>

                </div>

            </section>


            <!-- ============================= -->
            <!-- FOTOGRAFIAS -->
            <!-- ============================= -->

            <section
                id="profilePhotosSection"
                class="profile-photos-section hidden"
            >

                <div
                    id="profilePostsGrid"
                    class="profile-posts-grid"
                >

                    <div class="profile-posts-loading">
                        Carregando fotografias...
                    </div>

                </div>

            </section>

        </section>

    </main>


    <!-- ============================= -->
    <!-- MODAL EDITAR PERFIL -->
    <!-- ============================= -->

    <div
        id="editModal"
        class="modal hidden"
    >

        <div class="modal-content">

            <button
                type="button"
                id="closeModal"
                class="modal-close"
            >
                ×
            </button>

            <h2>
                Editar perfil
            </h2>


            <form id="profileForm">

                <div class="form-group">

                    <label for="editName">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="editName"
                        maxlength="40"
                        autocomplete="name"
                    >

                    <small id="nameChangeInfo">
                        ✓ Disponível para alteração
                    </small>

                </div>


                <div class="form-group">

                    <label for="editUsername">
                        Nome de usuário
                    </label>

                    <div class="username-input">

                        <span>@</span>

                        <input
                            type="text"
                            id="editUsername"
                            maxlength="30"
                            autocomplete="off"
                        >

                    </div>

                    <small id="usernameChangeInfo">
                        ✓ Disponível para alteração
                    </small>

                </div>


                <div class="form-group">

                    <label for="editBio">
                        Bio
                    </label>

                    <textarea
                        id="editBio"
                        maxlength="150"
                        rows="4"
                        placeholder="Conte um pouco sobre você..."
                    ></textarea>

                    <small>
                        Máximo de 150 caracteres.
                    </small>

                </div>


                <div
                    id="profileMessage"
                    class="profile-message"
                ></div>


                <button
                    type="submit"
                    class="save-profile-button"
                >
                    Salvar alterações
                </button>

            </form>

        </div>

    </div>


    <!-- ============================= -->
    <!-- SCRIPTS -->
    <!-- ============================= -->

    <script src="supabase.js"></script>

    <script src="auth-guard.js"></script>

    <script src="profile.js"></script>

</body>

</html>
