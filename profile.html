<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#faf9f7"
    >

    <title>Perfil — Vinci</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <main class="profile-page">


        <!-- =========================
             PERFIL
        ========================== -->

        <section class="profile">


            <div class="profile-top">


                <!-- FOTO -->

                <div
                    class="profile-avatar"
                    id="avatar"
                >

                    <span id="avatarLetter">
                        V
                    </span>

                </div>

                <input
    type="file"
    id="avatarInput"
    accept="image/jpeg,image/png,image/webp"
    hidden
>

                <button
    type="button"
    id="changeAvatar"
>
    Alterar foto
</button>

                <!-- INFORMAÇÕES -->

                <div class="profile-info">

                    <h1 id="profileName">
                        Carregando...
                    </h1>

                    <p id="profileUsername">
                        @usuario
                    </p>

                </div>


            </div>


            <!-- BIO -->

            <p
                id="profileBio"
                class="profile-bio"
            >
                Sua bio ainda está vazia.
            </p>


            <!-- EDITAR -->

            <button
                id="editProfile"
                class="button secondary"
            >
                Editar perfil
            </button>


            <!-- =========================
                 ESTATÍSTICAS
            ========================== -->

            <div class="profile-stats">


                <div>

                    <strong id="postsCount">
                        0
                    </strong>

                    <span>
                        Posts
                    </span>

                </div>


                <div>

                    <strong>
                        0
                    </strong>

                    <span>
                        Seguidores
                    </span>

                </div>


                <div>

                    <strong>
                        0
                    </strong>

                    <span>
                        Seguindo
                    </span>

                </div>


            </div>


        </section>


     
        <!-- =========================
             MODAL EDITAR PERFIL
        ========================== -->

        <div
            id="editModal"
            class="modal hidden"
        >


            <div class="modal-box">


                <!-- CABEÇALHO -->

                <div class="modal-header">

                    <h2>
                        Editar perfil
                    </h2>


                    <button
                        id="closeModal"
                        class="close-button"
                        type="button"
                    >
                        ×
                    </button>

                </div>



                <!-- FORMULÁRIO -->

                <form id="profileForm">


                    <!-- NOME -->

                    <label for="editName">
                        Nome
                    </label>


                    <input
                        type="text"
                        id="editName"
                        maxlength="40"
                        autocomplete="name"
                        required
                    >


                    <p
                        id="nameChangeInfo"
                        class="change-info"
                    >
                        Disponível para alteração
                    </p>



                    <!-- USERNAME -->

                    <label for="editUsername">
                        Nome de usuário
                    </label>


                    <div class="username-input">

                        <span>
                            @
                        </span>


                        <input
                            type="text"
                            id="editUsername"
                            maxlength="20"
                            autocomplete="username"
                            autocapitalize="none"
                            spellcheck="false"
                            required
                        >

                    </div>


                    <p
                        id="usernameChangeInfo"
                        class="change-info"
                    >
                        Disponível para alteração
                    </p>



                    <!-- BIO -->

                    <label for="editBio">
                        Bio
                    </label>


                    <textarea
                        id="editBio"
                        maxlength="150"
                        placeholder="Conte um pouco sobre você..."
                    ></textarea>


                    <p
                        id="profileMessage"
                        class="message"
                    ></p>


                    <!-- SALVAR -->

                    <button
                        type="submit"
                        class="button primary"
                    >
                        Salvar alterações
                    </button>


                </form>


            </div>


        </div>



    </main>

<!-- =====================================
     POSTS DO PERFIL
====================================== -->

<section
    id="profilePostsSection"
    class="profile-posts-section"
>

    <div class="profile-section-header">

        <h2>
            Posts
        </h2>

    </div>


    <div
        id="profilePosts"
        class="profile-posts"
    >

        <div class="profile-posts-loading">

            Carregando posts...

        </div>

    </div>

</section>

    <!-- =========================
         NAVEGAÇÃO INFERIOR
    ========================== -->

    <nav class="bottom-nav">


        <!-- POSTS -->

        <a href="index.html">

            <span>
                ⌂
            </span>

            Posts

        </a>



        <!-- POSTAR -->

        <a href="post.html">

            <span class="nav-post">
                +
            </span>

            Postar

        </a>



        <!-- PERFIL -->

        <a
            href="profile.html"
            class="active"
        >

            <span>
                ◯
            </span>

            Perfil

        </a>


    </nav>



    <!-- =========================
         SCRIPTS
    ========================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <script src="supabase.js"></script>

    <script src="auth-guard.js"></script>

    <script src="profile.js"></script>


</body>

</html>
