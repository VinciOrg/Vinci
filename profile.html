<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#faf9f7"
    >

    <title>Perfil — Vinci</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
    
    <link
    rel="stylesheet"
    href="likes.css"
>

    <link
        rel="stylesheet"
        href="replies.css"
    >

    <link rel="stylesheet" href="reply-photos.css">
    <link rel="stylesheet" href="featured-posts.css">
    <link rel="stylesheet" href="profile-hub.css">

</head>


<body>


<main class="profile-page">


    <!-- =====================================
         PERFIL
    ====================================== -->

    <section class="profile">


        <!-- CABEÇALHO -->

        <div class="profile-top">


            <!-- AVATAR -->

            <div
                class="profile-avatar"
                id="avatar"
            >

                <span id="avatarLetter">
                    V
                </span>

            </div>


            <input
                type="file"
                id="avatarInput"
                accept="image/jpeg,image/png,image/webp"
                hidden
            >


            <!-- INFORMAÇÕES -->

            <div class="profile-info">

                <h1 id="profileName">
                    Carregando...
                </h1>

                <p id="profileUsername">
                    @usuario
                </p>

            </div>


        </div>


        <!-- BIO -->

        <p
            id="profileBio"
            class="profile-bio"
        >
            Sua bio ainda está vazia.
        </p>


        <!-- BOTÕES -->

        <div class="profile-actions">

            <button
                id="editProfile"
                class="button secondary"
                type="button"
            >
                Editar perfil
            </button>


            <button
                id="changeAvatar"
                class="button secondary"
                type="button"
            >
                Alterar foto
            </button>

        </div>


        <!-- =================================
             ESTATÍSTICAS
        ================================== -->

        <div
            class="profile-stats"
            id="profileStats"
        >


            <div class="profile-stat">

                <strong id="postsCount">
                    0
                </strong>

                <span>
                    Publicações
                </span>

            </div>


            <div class="profile-stat">

                <strong>
                    0
                </strong>

                <span>
                    Seguidores
                </span>

            </div>


            <div class="profile-stat">

                <strong>
                    0
                </strong>

                <span>
                    Seguindo
                </span>

            </div>


        </div>


    </section>


    <!-- =====================================
         ABAS
    ====================================== -->

    <div class="profile-tabs">


        <button
            id="textPostsTab"
            class="profile-tab active"
            type="button"
        >
            Posts
        </button>


        <button
            id="photoPostsTab"
            class="profile-tab"
            type="button"
        >
            Publicações
        </button>


    </div>


    <!-- =====================================
         POSTS DE TEXTO
    ====================================== -->

    <section
        id="profilePostsSection"
        class="profile-content-section"
    >


        <div
            id="profilePosts"
            class="profile-posts"
        >

            <div class="profile-posts-loading">

                Carregando posts...

            </div>

        </div>


    </section>


    <!-- =====================================
         PUBLICAÇÕES / FOTOS
    ====================================== -->

    <section
        id="profilePhotosSection"
        class="profile-content-section hidden"
    >


        <div
            id="profilePostsGrid"
            class="profile-posts-grid"
        >

            <div class="profile-posts-loading">

                Carregando fotografias...

            </div>

        </div>


    </section>


    <!-- =====================================
         MODAL EDITAR PERFIL
    ====================================== -->

    <div
        id="editModal"
        class="modal hidden"
    >


        <div class="modal-box">


            <!-- CABEÇALHO -->

            <div class="modal-header">

                <h2>
                    Editar perfil
                </h2>


                <button
                    id="closeModal"
                    class="close-button"
                    type="button"
                >
                    ×
                </button>

            </div>


            <!-- FORMULÁRIO -->

            <form id="profileForm">


                <!-- NOME -->

                <label for="editName">
                    Nome
                </label>


                <input
                    type="text"
                    id="editName"
                    maxlength="40"
                    autocomplete="name"
                    required
                >


                <p
                    id="nameChangeInfo"
                    class="change-info"
                >
                    Disponível para alteração
                </p>


                <!-- USERNAME -->

                <label for="editUsername">
                    Nome de usuário
                </label>


                <div class="username-input">

                    <span>
                        @
                    </span>


                    <input
                        type="text"
                        id="editUsername"
                        maxlength="20"
                        autocomplete="username"
                        autocapitalize="none"
                        spellcheck="false"
                        required
                    >

                </div>


                <p
                    id="usernameChangeInfo"
                    class="change-info"
                >
                    Disponível para alteração
                </p>


                <!-- BIO -->

                <label for="editBio">
                    Bio
                </label>


                <textarea
                    id="editBio"
                    maxlength="150"
                    placeholder="Conte um pouco sobre você..."
                ></textarea>


                <p
                    id="profileMessage"
                    class="message"
                ></p>


                <!-- SALVAR -->

                <button
                    type="submit"
                    class="button primary"
                >
                    Salvar alterações
                </button>


            </form>


        </div>


    </div>


</main>


<!-- =====================================
     NAVEGAÇÃO INFERIOR
====================================== -->

<nav class="bottom-nav">

    <!-- FEED -->

    <a href="index.html">

        <span>
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M3.5 10.5L12 3.75l8.5 6.75"></path>
    <path d="M6 9.75V20h12V9.75"></path>
    <path d="M10 20v-5h4v5"></path>
</svg>
            </span>

        Posts

    </a>


    <!-- CRIAR -->

    <button
        type="button"
        id="openCreateMenu"
        class="nav-create"
    >

        <span class="nav-post">
                <svg class="nav-plus-icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 5v14"></path>
    <path d="M5 12h14"></path>
</svg>
            </span>

        Postar

    </button>


    <!-- PERFIL -->

    <a
        href="profile.html"
        class="active"
    >

        <span>
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="8" r="3.25"></circle>
    <path d="M5.5 19c1.65-2.85 4.1-4.25 6.5-4.25S16.85 16.15 18.5 19"></path>
</svg>
            </span>

        Perfil

    </a>

</nav>


<!-- =====================================
     MENU DE CRIAÇÃO
====================================== -->

<div
    id="createMenu"
    class="create-menu hidden"
>

    <div class="create-menu-content">

        <!-- FECHAR -->

        <button
            type="button"
            id="closeCreateMenu"
            class="create-menu-close"
        >
            ×
        </button>


        <!-- TÍTULO -->

        <div class="create-menu-title">

            <span>
                Vinci
            </span>

            <h2>
                O que você quer publicar?
            </h2>

        </div>


        <!-- PUBLICAÇÃO -->

        <button
            type="button"
            id="createPublication"
            class="create-option"
        >

            <div class="create-option-icon">
                <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 9.25A2.25 2.25 0 0 1 6.25 7h1.45l1.05-1.5h6.5L16.3 7h1.45A2.25 2.25 0 0 1 20 9.25v8.5A2.25 2.25 0 0 1 17.75 20h-11.5A2.25 2.25 0 0 1 4 17.75z"></path>
    <circle cx="12" cy="13" r="3.25"></circle>
</svg>
            </div>

            <div class="create-option-text">

                <strong>
                    Publicação
                </strong>

                <span>
                    Compartilhe uma fotografia
                </span>

            </div>

            <span class="create-option-arrow">
                →
            </span>

        </button>


        <!-- POST -->

        <button
            type="button"
            id="createProfilePost"
            class="create-option"
        >

            <div class="create-option-icon">
                <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M6.25 5.5h11.5A2.25 2.25 0 0 1 20 7.75v7.5a2.25 2.25 0 0 1-2.25 2.25H10l-4 3v-3H6.25A2.25 2.25 0 0 1 4 15.25v-7.5A2.25 2.25 0 0 1 6.25 5.5z"></path>
</svg>
            </div>

            <div class="create-option-text">

                <strong>
                    Post
                </strong>

                <span>
                    Compartilhe algo no seu perfil
                </span>

            </div>

            <span class="create-option-arrow">
                →
            </span>

        </button>


        <!-- CANCELAR -->

        <button
            type="button"
            id="cancelCreate"
            class="create-cancel"
        >
            Cancelar
        </button>

    </div>

</div>
<!-- =====================================
     SCRIPTS
====================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script src="supabase.js"></script>

<script src="auth-guard.js"></script>

<script src="profile.js"></script>

<script src="delete-system.js"></script>
<script src="likes.js"></script>
<script src="reply-photo-utils.js"></script>
<script src="replies.js"></script>
<script src="featured-posts.js"></script>
<script src="profile-hub.js"></script>
<script src="create.js"></script>
</body>
